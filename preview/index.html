<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/preview/favicon.svg" />
    <link rel="apple-touch-icon" href="/preview/apple-touch-icon.png" />
    <!-- maximum-scale + user-scalable=no suppress Safari's double-tap and pinch
         zoom so battlefield gestures act in-game; viewport-fit=cover lets us
         respect the iPad safe-area insets (references/ipad-traps.md). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6b8f3a" />
    <!-- iOS "Add to Home Screen" wants its own meta tags, not only the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plastic Battle" />
    <title>Plastic Battle</title>
    <script type="module" crossorigin src="/preview/assets/index-ChU1Qkt6.js"></script>
    <link rel="stylesheet" crossorigin href="/preview/assets/index-CI0cLaaa.css">
  </head>
  <body>
    <div id="root">
      <!-- Shown the instant the page paints, before any JavaScript has downloaded, so
           the screen is never blank while the app code loads. React replaces it (with
           the real 0–100% loader) as soon as it mounts. Same background colour, so the
           hand-off is seamless. -->
      <div
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2b3a22;color:#dfe7d8;font-family:system-ui,-apple-system,sans-serif"
      >
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:800;letter-spacing:0.5px">Plastic Battle</div>
          <div style="margin-top:14px;font-size:14px;opacity:0.8">Loading…</div>
        </div>
      </div>
    </div>
  </body>
</html>
